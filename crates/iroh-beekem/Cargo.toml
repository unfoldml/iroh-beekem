[package]
name = "iroh-beekem"
description = "Group-confidential, local-first collaborative workspaces over iroh, with BeeKEM continuous group key agreement."
readme = "README.md"
keywords = ["p2p", "crdt", "local-first", "encryption", "iroh"]
categories = ["cryptography", "network-programming", "asynchronous"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
# The `version` is not redundant with `path`: cargo refuses to publish a crate
# whose dependencies carry only a path, since crates.io has no path to resolve.
iroh-beekem-core = { path = "../iroh-beekem-core", version = "0.1.0" }
beekem.workspace = true
keyhive_crypto.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
postcard.workspace = true
thiserror.workspace = true
zeroize.workspace = true

iroh = "1.0.3"
iroh-blobs = "0.103.0"
iroh-docs = "0.101.0"
iroh-gossip = "0.101.0"

bytes = "1"
n0-future = "0.2"
# `time` is needed for the quiet period between re-announcements; see
# `workspace::republish_loop`.
# `fs` and `io-util` are for the asset API, which streams a file a segment at a
# time rather than materialising it — the whole point of the large-asset path.
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rand_chacha = "0.3"
# The asset tests need a real file on disk to stream from and back into; the
# asset API is path-based precisely because a multi-gigabyte file cannot be a
# `Vec<u8>`, so testing it without the filesystem would test something else.
tempfile = "3"
# Tests only, pinned to the major version `keyhive_crypto` uses: the encoding
# tests in `invite` are only meaningful if they serialize the way `Signed` does.
bincode = "1"
tracing-subscriber = "0.3"
tracing = "0.1"

[lints]
workspace = true
