[package]
name = "iroh-beekem-sim"
description = "Deterministic simulation and property tests for the iroh-beekem workspace protocol."
edition.workspace = true
# Higher than the workspace default, and unpublished, so it constrains only
# local development: `propsim` requires 1.96.
rust-version = "1.96"
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[dependencies]
iroh-beekem-core = { path = "../iroh-beekem-core", features = ["adversarial-testing"] }
beekem.workspace = true
keyhive_crypto.workspace = true
rand.workspace = true
rand_chacha = "0.3"
# Part of propsim-core's public API: the `Strategy` handed to `.workload(..)`.
# Must stay semver-compatible with the version propsim-core resolves, or the
# `BoxedStrategy` types will not unify.
proptest = "1"
# Pinned to a revision: `propsim` is unpublished and has no semver, so an
# unpinned git dependency would silently change what the property tests mean
# from one checkout to the next.
propsim-core = { git = "https://github.com/unfoldml/propsim", rev = "fc358b00afe68478b9a575d5e2814c3b75438e26" }

[dev-dependencies]
# `propsim` is not published on crates.io; only propsim-core and propsim-sim
# (Tiers 1 and 2) are usable today. The Elle/Jepsen backends and `propsim-iroh`
# are shape-only stubs, so nothing here depends on them.
propsim = { git = "https://github.com/unfoldml/propsim", rev = "fc358b00afe68478b9a575d5e2814c3b75438e26" }
# The engine itself, for `run_deterministic` and `evaluate_properties`. The
# facade re-exports neither, and the world runner needs both: `Run::run` stops at
# the first failing property of the first failing seed and discards the shrunk
# counterexample it computed, while a world asserts a whole property vector and a
# reader needs to know whether one property failed on one seed or all of them
# failed on every seed. See `tests/properties/harness.rs`.
#
# Must stay on the same revision as `propsim` above, or the two crates' `Property`
# types are distinct and nothing type-checks.
propsim-sim = { git = "https://github.com/unfoldml/propsim", rev = "fc358b00afe68478b9a575d5e2814c3b75438e26" }

[lints]
workspace = true
